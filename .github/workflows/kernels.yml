name: Kernels

# Boots Android's kernels in QEMU and runs `bbd selftest` on each
# (scripts/check-kernels.sh): whether the eBPF programs load, attach and
# fire is up to the kernel, which the other checks do not have.
#
# On every push that changes them, to any branch, so that a branch is
# checked before there is a pull request. Pull requests also check their
# test merge commit so the required result covers what would merge.
on:
  push:
    # The queue also pushes its temporary branch. Publish its result once.
    branches-ignore: ["gh-readonly-queue/**"]
    tags: ["**"]
    paths:
      - bb-ebpf/**
      - bb-common/**
      - bbd/**
      - Cargo.lock
      - Cargo.toml
      - scripts/check-kernels.sh
      - .github/workflows/kernels.yml
      # A change to the guides alone cannot change what the kernels run.
      - "!**/*.md"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files
        id: paths
        shell: bash
        env:
          DIFF_RANGE: >-
            ${{ github.event_name == 'pull_request' &&
                format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) ||
                github.event_name == 'merge_group' &&
                format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || '' }}
        run: |
          run=true
          if [[ -n "$DIFF_RANGE" ]]; then
            changed=$(git diff --name-only --no-renames "$DIFF_RANGE" -- \
              ':(glob)bb-ebpf/**' ':(glob)bb-common/**' ':(glob)bbd/**' Cargo.lock Cargo.toml \
              scripts/check-kernels.sh .github/workflows/kernels.yml ':(exclude,glob)**/*.md')
            if [[ -z "$changed" ]]; then
              run=false
            fi
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  selftest:
    name: Self-test on each kernel
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The runners have KVM, but only root may open it.
      - name: Let the job use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU, busybox and musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 busybox-static musl-tools
          rustup target add x86_64-unknown-linux-musl

      # The kernels are pinned by hash in the script's KERNELS list, so that
      # list names the cache.
      - name: Name the kernel cache
        id: kernels
        run: |
          list="$(sed -n '/^KERNELS=(/,/^)/p' scripts/check-kernels.sh | sha256sum | cut -c1-16)"
          echo "key=kernels-$list" >>"$GITHUB_OUTPUT"

      - name: Restore the kernels
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/big_brother/kernels
          key: ${{ steps.kernels.outputs.key }}

      - name: Run the self-test on each kernel
        run: ./scripts/check-kernels.sh

      # Also when a kernel fails: the downloads are as good either way.
      - name: Save the kernels
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/big_brother/kernels
          key: ${{ steps.kernels.outputs.key }}

  result:
    name: Kernels result
    needs: [changes, selftest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
