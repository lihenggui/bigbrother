name: Device

# The module and the app on emulators: scripts/install-on-emulator.sh puts
# them on a google_apis image (which allows adb root, and so needs no root
# manager), and the on-device checks run against the real daemon and kernel.
# Without LSPosed, check-sandbox.sh skips what needs the hook.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
  merge_group:

permissions:
  contents: read

# bash -eo pipefail: the checks' output goes through tee.
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request replaces the run in
# progress; the nightly run and one started by hand do not replace each other.
concurrency:
  group: device-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files
        id: paths
        shell: bash
        env:
          DIFF_RANGE: >-
            ${{ github.event_name == 'pull_request' &&
                format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) ||
                github.event_name == 'merge_group' &&
                format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || '' }}
        run: |
          run=true
          if [[ -n "$DIFF_RANGE" ]]; then
            changed=$(git diff --name-only --no-renames "$DIFF_RANGE" -- \
              ':(glob)bb-ebpf/**' ':(glob)bb-common/**' ':(glob)bbd/**' Cargo.toml Cargo.lock \
              ':(glob)module/**' ':(glob)scripts/**' \
              ':(glob)android/app/**' ':(glob)android/helper/**' ':(glob)android/hook/**' \
              ':(glob)android/canary/**' ':(glob)android/build-logic/**' ':(glob)android/gradle/**' \
              android/build.gradle.kts android/settings.gradle.kts \
              ':(glob).github/actions/setup/**' .github/workflows/device.yml \
              ':(exclude,glob)**/*.md')
            if [[ -z "$changed" ]]; then
              run=false
            fi
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test the survival log checks
        run: ./scripts/check-survival-log.sh

      - name: Build the module
        run: ./scripts/build.sh

      - name: Build both canaries
        working-directory: android
        run: ./gradlew :canary:assembleDebug :canary:assembleNoDeclarations

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-build
          path: |
            out/big_brother-*.apk.zip
            android/canary/build/outputs/apk/debug/canary-debug.apk
            android/canary/build/outputs/apk/noDeclarations/canary-noDeclarations.apk
          if-no-files-found: error
          retention-days: 3

  check:
    name: API ${{ matrix.api }} ${{ matrix.part }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Kernels 5.15 (33), 6.1 (34) and 6.6 (35, 36). The images of API
        # 31 and 32 have a kernel without BTF, which the module refuses; on
        # those of 36.1 and 37.0 (6.12), SurfaceFlinger aborts in the
        # emulator's software rendering and takes the system down with it.
        api: ["33", "34", "35", "36"]
        # The permission matrix takes longer than the other checks together,
        # so two emulators share it.
        part: [checks, permissions-1, permissions-2]
    env:
      IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
      LOGS: ${{ github.workspace }}/device-logs
      # Where avdmanager writes the AVD and the emulator looks for it.
      ANDROID_AVD_HOME: ${{ github.workspace }}/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: device-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Not cached: one image is about 1.5 GB, and the images of the matrix
      # would push the build caches out of the repository's 10 GB.
      - name: Install the emulator and the system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          # A download that breaks off leaves an archive sdkmanager cannot
          # read; it is fetched again.
          for attempt in 1 2 3; do
            "$sdkmanager" --install platform-tools emulator "$IMAGE" >/dev/null && break
            ((attempt < 3)) || exit 1
          done
          echo "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >>"$GITHUB_PATH"

      # Cold boot without snapshots. Ultra-wideband and the Vulkan virtual
      # queue crash some images; a second core and software rendering keep
      # the system responsive enough for the canary's timeouts.
      - name: Start the emulator
        run: |
          mkdir -p "$LOGS" "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name device --package "$IMAGE" --device pixel_6 --force >/dev/null
          # Some images leave too little room by default for the app, the
          # canary and the records.
          echo "disk.dataPartition.size=6G" >>"$ANDROID_AVD_HOME/device.avd/config.ini"
          nohup emulator -avd device -no-window -no-audio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect -cores 2 -memory 4096 \
            -feature -Uwb,-VulkanVirtualQueue >"$LOGS/emulator.txt" 2>&1 &
          emulator=$!
          for ((i = 0; i < 300; i++)); do
            kill -0 "$emulator" 2>/dev/null || break
            # Booted, and the services the steps use are up.
            booted="$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            settings="$(timeout 10 adb shell service check settings 2>/dev/null || true)"
            package="$(timeout 10 adb shell service check package 2>/dev/null || true)"
            [[ "$booted" == 1 && "$settings" == *": found"* && "$package" == *": found"* ]] && break
            sleep 2
          done
          if ((i == 300)) || ! kill -0 "$emulator" 2>/dev/null; then
            echo "::error::the emulator did not boot"
            cat "$LOGS/emulator.txt"
            exit 1
          fi
          adb shell uname -r

      # A crash dialog of some system app would take the canary's focus, and
      # a screen that turns off would keep it from getting any.
      - name: Prepare the emulator
        run: |
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null

      - name: Install the module
        run: ./scripts/install-on-emulator.sh 2>&1 | tee "$LOGS/install.txt"

      # For minutes after boot and the install the system is busy, and the
      # app ops helper, a Java runtime started again for each case, can then
      # take longer to start than the daemon waits for it. The other checks
      # used to give the emulator that time; the matrix now waits for the
      # load to come down, for five minutes at most.
      - name: Wait for the emulator to settle
        if: startsWith(matrix.part, 'permissions-')
        run: |
          for ((i = 0; i < 60; i++)); do
            load="$(adb shell cat /proc/loadavg | cut -d ' ' -f 1)"
            awk -v load="$load" 'BEGIN { exit !(load < 1.0) }' && break
            sleep 5
          done
          echo "waited $((i * 5)) s, load $load"

      - name: Check the records
        if: matrix.part == 'checks'
        run: ./scripts/check-canary.sh 2>&1 | tee "$LOGS/check-canary.txt"

      # An emulated CPU without a GPU holds starts for longer than a phone:
      # 10 to 75 ms at the 95th percentile on these runners.
      - name: Check the sandbox
        if: matrix.part == 'checks'
        run: ./scripts/check-sandbox.sh --stress 20 --max-hold-ms 100 2>&1 | tee "$LOGS/check-sandbox.txt"

      - name: Check sandboxed process survival
        if: matrix.part == 'checks'
        timeout-minutes: 14
        run: ./scripts/check-survival.sh 2>&1 | tee "$LOGS/check-survival.txt"

      # Each case installs the canary afresh and starts it once: about 20
      # seconds, more for those that restart the helper or the daemon.
      - name: Check the permissions
        if: startsWith(matrix.part, 'permissions-')
        timeout-minutes: 45
        env:
          PART: ${{ matrix.part }}
        run: ./scripts/check-permissions.sh --shard "${PART#permissions-}/2" 2>&1 | tee "$LOGS/check-permissions.txt"

      - name: Collect the logs
        if: always()
        run: |
          mkdir -p "$LOGS"
          timeout 60 adb root >/dev/null 2>&1 || true
          # adb waits for a device that has gone, as it does after a crash.
          timeout 60 adb shell cat /data/adb/big_brother/bbd.log >"$LOGS/bbd.log" 2>&1 || true
          timeout 60 adb logcat -d >"$LOGS/logcat.txt" 2>&1 || true
          timeout 60 adb shell dmesg >"$LOGS/dmesg.txt" 2>&1 || true

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-logs-api-${{ matrix.api }}-${{ matrix.part }}
          path: device-logs
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: Device result
    needs: [changes, build, check]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      # A leg cancelled before runner assignment can leave the matrix result green.
      - name: Verify each emulator result
        if: needs.check.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A partial rerun can carry forward earlier legs. Four APIs with
          # three parts each.
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" |
            jq -e '
              [.[].jobs[] | select(.name | test("^API [0-9]+ "))]
              | group_by(.name) | map(max_by(.run_attempt))
              | length == 12 and all(.[]; .conclusion == "success" or .conclusion == "skipped")
            '
