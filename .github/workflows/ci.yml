name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test the daemon
        run: cargo test

      - name: Check the module scripts
        run: |
          for script in module/*.sh scripts/*.sh; do
            bash -n "$script"
          done

      # The app's sources get theirs from Spotless, checked below.
      - name: Check license headers
        run: |
          missing=$(git ls-files '*.rs' '*.sh' | xargs grep -L 'GNU General Public License' || true)
          if [ -n "$missing" ]; then
            echo "Missing license header:"
            echo "$missing"
            exit 1
          fi

      - name: Check the app's formatting and license headers
        working-directory: android
        run: ./gradlew spotlessCheck :build-logic:convention:spotlessCheck

      # Also needed by the app's tests: packaging the app takes the daemon
      # from out/.
      - name: Build the APK
        run: ./scripts/build.sh

      - name: Test the app
        working-directory: android
        run: ./gradlew test

      # A new library, permission or license comes in with a reviewed change:
      # the baselines are app/dependencies/ and app/release-badging.txt.
      - name: Check the app's dependencies, permissions and licenses
        working-directory: android
        run: ./gradlew :app:dependencyGuard :app:checkReleaseBadging :app:licenseeAndroidRelease

      - name: Lint the app
        working-directory: android
        run: ./gradlew :app:lintRelease

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      # Signed with the debug key; release builds come from release.yml.
      - name: Upload the module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: big_brother-debug-signed
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
