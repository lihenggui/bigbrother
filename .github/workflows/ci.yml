name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files
        id: paths
        shell: bash
        env:
          DIFF_RANGE: >-
            ${{ github.event_name == 'pull_request' &&
                format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) ||
                github.event_name == 'merge_group' &&
                format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || '' }}
        run: |
          run=true
          if [[ -n "$DIFF_RANGE" ]]; then
            changed=$(git diff --name-only --no-renames "$DIFF_RANGE" -- \
              ':(exclude,glob)**/*.md' ':(exclude,glob)docs/**')
            if [[ -z "$changed" ]]; then
              run=false
            fi
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run host checks
        run: ./scripts/check.sh

      - name: Upload the lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-release.html
            android/**/build/reports/lint-results-debug.html
            android/**/build/reports/lint-results.html
          if-no-files-found: ignore

      # Signed with the debug key; release builds come from release.yml.
      - name: Upload the module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: big_brother-debug-signed
          path: out/big_brother-*.apk.zip
          if-no-files-found: error
          retention-days: 14

  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
