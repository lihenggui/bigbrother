[workspace]
resolver = "2"
members = ["bbd", "bb-common", "bb-ebpf"]
default-members = ["bbd", "bb-common"]

[workspace.package]
version = "0.1.0"
authors = ["Mercury Li"]
license = "GPL-3.0-only"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.16.0", default-features = false }
aya-build = { version = "0.2.1", default-features = false }
aya-ebpf = { version = "0.3.0", default-features = false }

anyhow = { version = "1.0.104", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
libc = { version = "0.2.191", default-features = false }
tokio = { version = "1.54.1", default-features = false }
which = { version = "8.0.6", default-features = false }

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1

[profile.release.package.bb-ebpf]
# Keep the existing optimization level for programs that run on kernel hot paths.
opt-level = 3
debug = 2
codegen-units = 1
strip = false
